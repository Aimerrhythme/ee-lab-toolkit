name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Collect and run tool tests
        run: |
          if ls tools/*/tests/test_*.py 1>/dev/null 2>&1; then
            pytest -q
          else
            echo "No tool tests yet; scaffold OK"
          fi
