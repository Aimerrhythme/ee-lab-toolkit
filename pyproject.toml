[project]
name = "ee-lab-toolkit"
version = "0.1.0"
description = "MATLAB + Python dual-runtime toolkit for electrical engineering lab teaching"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aimerrhythme" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[tool.pytest.ini_options]
testpaths = ["tools"]
python_files = ["test_*.py"]
